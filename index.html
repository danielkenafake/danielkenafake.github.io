    <!-- Lightbox -->
    <div class="lightbox" id="lightbox">

    <span class="close" id="close">&times;</span>

    <button class="lightbox-prev" id="lightbox-prev" aria-label="Previous image">
        &#10094;

    <button class="lightbox-next" id="lightbox-next" aria-label="Next image">
        &#10095;
    </button>

<script>

    /*
     * ==========================================
     * PHOTO GRID / MASONRY
     * ==========================================
     */

    const grids = document.querySelectorAll(".photo-grid");


    function getColumnCount() {

        if (window.innerWidth <= 450) {
            return 1;
        }

        if (window.innerWidth <= 700) {
            return 2;
        }

        if (window.innerWidth <= 1100) {
            return 3;
        }

        return 4;
    }


    async function buildPhotoGrid(grid) {

        const photos = Array.from(
            grid.querySelectorAll(".photo")
        );

        const columnCount = getColumnCount();


        /*
         * Wait for all images to load before
         * calculating the masonry layout.
         */

        const images = photos.map(photo =>
            photo.querySelector("img")
        );

        await Promise.all(

            images.map(img => {

                if (img.complete) {
                    return Promise.resolve();
                }

                return new Promise(resolve => {

                    img.addEventListener(
                        "load",
                        resolve,
                        { once: true }
                    );

                    img.addEventListener(
                        "error",
                        resolve,
                        { once: true }
                    );

                });

            })

        );


        /*
         * Remove the existing photos from the grid.
         */

        grid.innerHTML = "";


        /*
         * Create the columns.
         */

        const columns = [];

        for (let i = 0; i < columnCount; i++) {

            const column =
                document.createElement("div");

            column.className = "photo-column";

            grid.appendChild(column);

            columns.push(column);

        }


        /*
         * Keep track of the approximate height
         * of each column.
         */

        const heights =
            new Array(columnCount).fill(0);


        /*
         * Put each image into the shortest
         * column.
         */

        photos.forEach(photo => {

            const shortestColumn =
                heights.indexOf(
                    Math.min(...heights)
                );


            columns[shortestColumn]
                .appendChild(photo);


            const image =
                photo.querySelector("img");


            /*
             * Calculate the displayed image
             * height from its aspect ratio.
             */

            const columnWidth =
                grid.clientWidth / columnCount;


            const displayedHeight =
                columnWidth *
                (image.naturalHeight /
                 image.naturalWidth);


            heights[shortestColumn] +=
                displayedHeight;

        });

    }


    /*
     * Build all photo grids.
     */

    async function buildAllGrids() {

        for (const grid of grids) {

            await buildPhotoGrid(grid);

        }

    }


    /*
     * Initial build.
     */

    buildAllGrids();


    /*
     * Rebuild after resizing.
     */

    let resizeTimer;

    window.addEventListener("resize", () => {

        clearTimeout(resizeTimer);

        resizeTimer = setTimeout(() => {

            buildAllGrids();

        }, 150);

    });



    /*
     * ==========================================
     * LIGHTBOX
     * ==========================================
     */

    const lightbox =
        document.getElementById("lightbox");

    const lightboxImage =
        document.getElementById("lightbox-image");

    const close =
        document.getElementById("close");

    const previousButton =
        document.getElementById("lightbox-prev");

    const nextButton =
        document.getElementById("lightbox-next");


    let currentGallery = [];

    let currentIndex = 0;


    /*
     * Display an image in the lightbox.
     */

    function showImage(index) {

        if (!currentGallery.length) {
            return;
        }


        /*
         * Wrap around at either end.
         */

        if (index < 0) {
            index = currentGallery.length - 1;
        }

        if (index >= currentGallery.length) {
            index = 0;
        }


        currentIndex = index;


        const image =
            currentGallery[currentIndex]
                .querySelector("img");


        lightboxImage.src =
            image.src;

        lightboxImage.alt =
            image.alt;


        /*
         * Hide navigation if there is
         * only one image.
         */

        if (currentGallery.length <= 1) {

            previousButton.style.display = "none";
            nextButton.style.display = "none";

        } else {

            previousButton.style.display = "";
            nextButton.style.display = "";

        }

    }


    /*
     * Open lightbox when a photo is clicked.
     */

    document.addEventListener("click", event => {

        const photo =
            event.target.closest(".photo");


        if (!photo) {
            return;
        }


        /*
         * Find the particular grid this
         * photograph belongs to.
         */

        const grid =
            photo.closest(".photo-grid");


        if (!grid) {
            return;
        }


        /*
         * Only include photos from this
         * particular gallery.
         */

        currentGallery =
            Array.from(
                grid.querySelectorAll(".photo")
            );


        currentIndex =
            currentGallery.indexOf(photo);


        showImage(currentIndex);


        lightbox.classList.add("active");

        document.body.style.overflow =
            "hidden";

    });


    /*
     * Previous image.
     */

    previousButton.addEventListener(
        "click",
        event => {

            event.stopPropagation();

            showImage(currentIndex - 1);

        }
    );


    /*
     * Next image.
     */

    nextButton.addEventListener(
        "click",
        event => {

            event.stopPropagation();

            showImage(currentIndex + 1);

        }
    );


    /*
     * Close lightbox.
     */

    function closeLightbox() {

        lightbox.classList.remove("active");

        document.body.style.overflow = "";

    }


    close.addEventListener(
        "click",
        closeLightbox
    );


    /*
     * Clicking the dark background closes
     * the lightbox.
     */

    lightbox.addEventListener(
        "click",
        event => {

            if (event.target === lightbox) {

                closeLightbox();

            }

        }
    );


    /*
     * Keyboard controls.
     */

    document.addEventListener(
        "keydown",
        event => {

            if (!lightbox.classList.contains("active")) {
                return;
            }


            if (event.key === "Escape") {

                closeLightbox();

            }


            if (event.key === "ArrowLeft") {

                showImage(currentIndex - 1);

            }


            if (event.key === "ArrowRight") {

                showImage(currentIndex + 1);

            }

        }
    );

</script>
